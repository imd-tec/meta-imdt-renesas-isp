# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"


BBFILE_COLLECTIONS += "imdt-renesas-isp"
BBFILE_PATTERN_imdt-renesas-isp = "^${LAYERDIR}/"
BBFILE_PRIORITY_imdt-renesas-isp = "20"

LAYERDEPENDS_imdt-renesas-isp = "imdt-renesas meta-rz-isp"
LAYERSERIES_COMPAT_imdt-renesas-isp = "scarthgap"

# Signal that ISP support is active — gates kernel config and warns on non-ISP image builds
DISTRO_FEATURES:append = " imdt-isp"


